name: Bug report
description: Report a problem with provisioning, the OTEL collector, or telemetry flow
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to file a bug report. Please fill in as much detail as you can.
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g. macOS 15.2, Windows 11, Ubuntu 24.04"
    validations:
      required: true
  - type: input
    id: azd-version
    attributes:
      label: azd version
      description: Run `azd version` and paste the output here.
      placeholder: "e.g. azd version 1.25.0"
    validations:
      required: true
  - type: input
    id: docker-version
    attributes:
      label: Docker version
      description: Run `docker version --format '{{.Client.Version}}'`
      placeholder: "e.g. 27.0.3"
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A numbered list of steps that reliably reproduces the issue.
      placeholder: |
        1. Run `azd up`
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste collector logs (`docker logs otel-collector`) or azd output here.
      render: shell
