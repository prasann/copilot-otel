# OpenTelemetry Collector configuration for GitHub Copilot telemetry.
# The connection string is injected at container start via the
# APPLICATIONINSIGHTS_CONNECTION_STRING environment variable.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}
  resource:
    attributes:
      - key: service.namespace
        value: copilot
        action: upsert
      - key: deployment.environment
        value: ${env:DEPLOYMENT_ENV}
        action: upsert

exporters:
  azuremonitor:
    connection_string: ${env:APPLICATIONINSIGHTS_CONNECTION_STRING}
  debug:
    verbosity: basic

service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [azuremonitor, debug]
    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [azuremonitor]
    logs:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [azuremonitor]
